schema_version: infod2pctw-manuscript-benchmark-v1

training_configs_approved: true #false
execution_environment: hpc # Set to local for a configured local workflow.

# Edit only this block to choose the workflow scope.
run:
  datasets: [fp]
  models: [d2pcca]
  evaluate: false
  build_manuscript_table: false

paths:
  benchmark_root: infod2pctw_benchmarks
  output_root: results
  local_python: python
  hpc_python: python

hpc:
  slurm_account: YOUR_SLURM_ACCOUNT
  gpu_model: h100

datasets:
  lfp:
    identity: esc
    modality_evidence: released LFP clock and spectral-feature interpolation
    bundle:
      local: data/lfp/bundle
      hpc: /path/to/benchmark/data/lfp/bundle
    infod2pctw_result:
      local: data/lfp/reference
      hpc: /path/to/benchmark/data/lfp/reference
    infod2pctw_evaluation:
      local: data/lfp/reference/benchmark_export
      hpc: /path/to/benchmark/data/lfp/reference/benchmark_export

  fp:
    identity: fp
    modality_evidence: continuous processed fiber-photometry signal
    bundle:
      local: data/fp/bundle
      hpc: /path/to/benchmark/data/fp/bundle
    infod2pctw_result:
      local: data/fp/reference
      hpc: /path/to/benchmark/data/fp/reference
    infod2pctw_evaluation:
      local: data/fp/reference/benchmark_export
      hpc: /path/to/benchmark/data/fp/reference/benchmark_export

  miniscope:
    identity: miniscope
    modality_evidence: processed calcium observations on a miniscope acquisition clock
    bundle:
      local: data/miniscope/bundle
      hpc: /path/to/benchmark/data/miniscope/bundle
    infod2pctw_result:
      local: data/miniscope/reference
      hpc: /path/to/benchmark/data/miniscope/reference
    infod2pctw_evaluation:
      local: data/miniscope/reference/benchmark_export
      hpc: /path/to/benchmark/data/miniscope/reference/benchmark_export

models:
  d2pcca:
    kind: baseline
    config: infod2pctw_benchmarks/configs/d2pcca.yaml
  infodpcca:
    kind: baseline
    config: infod2pctw_benchmarks/configs/infodpcca.yaml
  dpctw:
    kind: baseline
    config: infod2pctw_benchmarks/configs/dpctw.yaml
  infod2pctw:
    kind: reference
    config: infod2pctw/configs/infod2pctw_config.yaml
    recorded_git_commit: null # Supply the commit for your reference export.
    retrain: false


proposed_training:
  d2pcca:
    epochs: 301
    annealing_epochs: 100
    minimum_annealing_factor: 0.01
  infodpcca:
    stage_I_epochs: 1000
    stage_II_epochs: 1500
    alpha: 1.0
    beta: 0.1
  dpctw:
    max_em_iterations: 50
    em_tolerance: 0.0001
    max_alignment_iterations: 20
    alignment_tolerance: 0.0001
    band_radius_frames: 100
  infod2pctw:
    stage_I_epochs: 80
    alignment_warmup_epochs: 20
    alignment_update_every_epochs: 5
    max_alignment_updates: 12
    convergence_patience: 3
    stage_II_epochs: 50
    band_radius_fraction: 0.02

resources:
  d2pcca:
    threads: 8
    gpu: 1
    mem_mb: 65536
    runtime: 2880
  infodpcca:
    threads: 8
    gpu: 1
    mem_mb: 98304
    runtime: 4320
  dpctw:
    threads: 16
    gpu: 0
    mem_mb: 262144
    runtime: 5760
